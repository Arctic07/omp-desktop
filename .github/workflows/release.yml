# Release pipeline
#
# Trigger: push a tag `vX.Y.Z` that matches every APP_VERSION site. The version and publishing
# contract is `rules.md#release-versions-and-publishing`.
#
# The tag is the release decision. This workflow builds the host artifact and the frontend, then
# `tauri-action` builds the NSIS installer with its updater signature and publishes the release plus
# `latest.json` — the one feed the application's updater reads.
#
# Required repository secret:
# - `TAURI_SIGNING_PRIVATE_KEY`: the private half of the key whose public half is in
#   `src-tauri/tauri.conf.json`. The key lives outside the repository; losing it strands every
#   installed copy.
#
# The key this repository generated has no password, so the workflow passes none. A
# password-protected key would need `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` added to this env and to
# the repository secrets; leaving the password env set while the key has none fails the build with
# "incorrect updater private key password".
#
# Only Windows is published: the host artifact and the installer this repository builds are the
# Windows x64 ones. The feed names that platform alone.

name: Release

on:
  push:
    tags: ['v*.*.*']

# Least privilege: only the publish step writes the release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Full history and tags: the release body is generated from the commit range between the
      # previous stable tag and this one, and a shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the tag matches every version site
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            *-*) echo "::error::prerelease tags are not published to the stable feed"; exit 1 ;;
          esac
          node --input-type=module - "${GITHUB_REF_NAME#v}" <<'NODE'
          import { readFileSync } from 'node:fs'

          const version = process.argv[2]
          const json = (file) => JSON.parse(readFileSync(file, 'utf8'))
          const sites = [
            ['package.json', json('package.json').version],
            ['src-tauri/tauri.conf.json', json('src-tauri/tauri.conf.json').version],
            ['src-tauri/Cargo.toml', /^version = "([^"]+)"/m.exec(readFileSync('src-tauri/Cargo.toml', 'utf8'))?.[1]],
            ['host/src/constants.ts', /HOST_VERSION = '([^']+)'/.exec(readFileSync('host/src/constants.ts', 'utf8'))?.[1]],
          ]

          let failed = false
          for (const [file, found] of sites) {
            if (found !== version) {
              console.error(`::error file=${file}::${file} says ${found ?? 'nothing'}, the tag says ${version}`)
              failed = true
            }
          }
          if (failed) process.exit(1)
          NODE

      - name: Frontend gates
        shell: bash
        run: |
          pnpm --filter src typecheck
          pnpm --filter src lint
          pnpm --filter src test

      - name: Build the host artifact
        run: pnpm host:install

      # The release body is derived from this tag's own commit range, never a fixed sentence
      # (`rules.md#release-versions-and-publishing`). `release-notes.mjs` groups the commits between
      # the previous stable tag and this one; a missing previous tag means this is the first release.
      - name: Generate the release body
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs --tag "${GITHUB_REF_NAME}" > release-notes.md
          {
            echo 'body<<RELEASE_BODY_EOF'
            cat release-notes.md
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: OMP Desktop ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
